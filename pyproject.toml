[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simdecision"
version = "0.1.0"
description = "A cheap decision model drives Android, iOS and TV simulators; code checks the result."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["testing", "android", "ios", "tvos", "android-tv", "simulator", "emulator", "agents", "mcp", "ui-testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
simdecision = "simdecision.cli:main"

[project.urls]
Homepage = "https://github.com/paradox1612/simdecision"

[tool.setuptools]
packages = ["simdecision", "simdecision.fixture_servers"]

[tool.setuptools.package-data]
simdecision = ["bridge/*.swift", "bridge/*.yml", "bridge/*.sh", "bridge/Host/*"]
