# Standalone XCUITest bridge for the simdecision runtime. Drives an installed app by bundle id: no changes to the
# app's own Xcode project. Generate + build: ../ios_build.sh (iOS) and ../tvos_build.sh (tvOS). One Swift source for both.
name: QABridge
options:
  bundleIdPrefix: dev.simdecision.bridge
  deploymentTarget: { iOS: "17.0", tvOS: "17.0" }
targets:
  QABridgeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simdecision.bridge.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  QABridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QABridge.swift]
    dependencies: [{ target: QABridgeHost }]
    settings:
      base:
        TEST_TARGET_NAME: QABridgeHost
        PRODUCT_BUNDLE_IDENTIFIER: dev.simdecision.bridge.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  QABridgeTVHost:
    type: application
    platform: tvOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simdecision.bridge.tvhost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  QABridgeTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [QABridge.swift]
    dependencies: [{ target: QABridgeTVHost }]
    settings:
      base:
        TEST_TARGET_NAME: QABridgeTVHost
        PRODUCT_BUNDLE_IDENTIFIER: dev.simdecision.bridge.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  QABridgeTV:
    build: { targets: { QABridgeTVHost: all, QABridgeTVUITests: [test] } }
    test: { targets: [QABridgeTVUITests] }
  QABridge:
    build: { targets: { QABridgeHost: all, QABridgeUITests: [test] } }
    test: { targets: [QABridgeUITests] }
